name: Fetch dev.to Articles

on:
  schedule:
    # Run every Monday at 10am UTC (an hour after the X articles import)
    - cron: "0 10 * * 1"
  workflow_dispatch: # Allow manual triggers

jobs:
  fetch-articles:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch dev.to articles
        run: node scripts/fetch-devto-articles.mjs

      - name: Check for new articles
        id: changes
        run: |
          git add src/content/blog/
          if git diff --cached --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "feat: import new dev.to articles"
          title: "New dev.to articles import"
          body: |
            Automated import of new articles from dev.to (@bengreenberg).

            Please review the imported content before merging.
          branch: devto-articles-import
          delete-branch: true
          labels: content
